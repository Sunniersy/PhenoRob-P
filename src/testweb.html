<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PhoneRob - G 表型采集系统</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 20px;
    }

    .container {
      border: 2px solid #000;
      border-radius: 10px;
      padding: 20px 40px;
      width: 95%;
      height: 90vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .status {
      position: absolute;
      top: 40px;
      left: 60px;
      color: #2e7d32;
      font-size: 16px;
    }

    .status span {
      color: #2e7d32;
      margin-left: 6px;
    }

    .main {
      display: flex;
      flex: 1;
      margin-top: 20px;
    }

    .sidebar {
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 14px;
    }

    .form-group label {
      font-weight: 500;
    }

    .pot-range {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pot-range input {
      width: 60px;
      height: 28px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    select {
      width: 120px;
      height: 32px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      padding: 2px 6px;
    }

    .btn {
      width: 120px;
      height: 50px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border: 2px solid #000;
    }

    .btn-start {
      background-color: #d9f2e1;
    }

    .btn-stop {
      background-color: #f9dcdc;
    }

    .map-container {
      flex: 1;
      margin-left: 60px;
      background-color: #f3f5fc;
      border: 1.5px solid #7b84c2;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status">已连接 <span>87%</span></div>
    <div class="header">PhoneRob - G 表型采集系统</div>

    <div class="main">
      <div class="sidebar">
        <div class="form-group">
          <label>目标盆栽编号</label>
          <div class="pot-range">
            <input type="number" value="203">
            <span>—</span>
            <input type="number" value="219">
          </div>
        </div>

        <div class="form-group">
          <label>采集方式</label>
          <select>
            <option>扫描</option>
            <option>拍摄</option>
            <option>测距</option>
          </select>
        </div>

        <button class="btn btn-start">开始任务</button>
        <button class="btn btn-stop">结束任务</button>
      </div>

      <div class="map-container">
        地图
      </div>
    </div>
  </div>
</body>
</html>
