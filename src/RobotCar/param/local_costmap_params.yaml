local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint

  update_frequency: 10.0
  publish_frequency: 10.0
  transform_tolerance: 0.5  
  track_unknown_space: false #解决不能规划未知坐标点的问题

  inflation_radius: 0.1 #膨胀值
  cost_scaling_factor: 3.0 #膨胀比例，值越大代价越小

  static_map: false  
  rolling_window: true
  width: 3
  height: 3
  resolution: 0.04
  
