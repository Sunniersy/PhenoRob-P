listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
sys_interval 10

# 消息大小限制 (1MB)
max_packet_size 1048576
message_size_limit 1048576

# 持久化配置
persistence true
persistence_location /mosquitto/data/

# 日志
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

